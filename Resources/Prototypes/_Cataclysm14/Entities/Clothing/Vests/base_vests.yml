#Standard armor vest, allowed for security and bartenders
- type: entity
  parent: [ClothingOuterArmorBase, ClothingArmorPlate] # Mono - armor plates
  id: BaseClothingOuterBulletProofVest
  components:
  - type: Tag  # Mono
    tags:
    - Kevlar
  - type: Item
    storedScale: 3.5

#MARK: Toggleable
- type: entity
  abstract: true
  parent: BaseClothingOuterBulletProofVest
  id: BaseClothingOuterBulletProofVestToggleable
  components:
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container {}
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
  - type: ToggleableClothing
    requiredSlot: OUTERCLOTHING
    clothingPrototypes:
      head: ClothingHeadHelmetBlock
  - type: HoodedClothing
    equippedPrefix: raised
