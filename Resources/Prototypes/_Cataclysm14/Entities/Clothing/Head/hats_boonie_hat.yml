#MARK: black
- type: entity
  parent: BaseClothingHead
  id: ClothingHeadHatBoonieHatBlack
  name: boonie hat (black)
  description: A boonie hat, made for hunters and for protecting your head from the sun.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Head/Hats/hat_boonie_hat_any.rsi
    color: "#3B3B3B"
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Head/Hats/hat_boonie_hat_any.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#3B3B3B"
  - type: Item
    shape:
    - 0,0,0,1
    storedScale: 2
    storedOffset: 0,3
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#3B3B3B"
      right:
      - state: inhand-right
        color: "#3B3B3B"

