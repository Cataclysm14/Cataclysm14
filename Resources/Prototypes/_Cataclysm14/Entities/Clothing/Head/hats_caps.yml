#MARK: flippable base
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatCapBaseFlippable
  abstract: true
  components:
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-flip-verb
    foldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon_raised
      map: ["foldedLayer"]
      visible: false

#MARK: flipped base
- type: entity
  parent: ClothingHeadHatCapBaseFlippable
  id: ClothingHeadHatCapBaseFlipped
  suffix: flipped
  abstract: true
  components:
  - type: Foldable
    folded: true
  - type: Clothing
    equippedPrefix: flipped
  - type: Item
    heldPrefix: flipped
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
      visible: false
    - state: icon_raised
      map: ["foldedLayer"]
      visible: true

#MARK:  white
- type: entity
  parent: ClothingHeadHatCapBaseFlippable
  id: ClothingHeadHatCapWhite
  name: cap (white)
  description: A plain colored cap.
  components:
  - type: Sprite
    scale: 0.5,0.5
    sprite: _Cataclysm14/Clothing/Head/Hats/hat_cap_greyscale.rsi
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Head/Hats/hat_cap_greyscale.rsi

#MARK: white flipped
- type: entity
  parent: [ClothingHeadHatCapBaseFlipped, ClothingHeadHatCapWhite]
  id: ClothingHeadHatCapWhiteFlipped
  name: cap (white)

