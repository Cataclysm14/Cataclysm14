#MARK: TShirt
- type: entity
  parent: BaseClothingShirt
  id: ClothingShirtCombatMulticamWoodlandTShirt
  name: combat t-shirt (multicam woodland)
  description: >
    Ripstop combat pants with large pockets.
    Originally created by the American company Crye Precision the multicam woodland patern was adopted by a pletora of army throughout the world.
    This one dones greener and darker colors for cold forests.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Shirt/ShirtsCombat/MulticamWoodland/shirt_multicam_woodland_Tshirt.rsi
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Shirt/ShirtsCombat/MulticamWoodland/shirt_multicam_woodland_Tshirt.rsi

