#MARK: orange, yellow
- type: entity
  parent: BaseClothingShirtToggleable
  id: ClothingShirtHoodieHighVisOrangeYellow
  name: hoodie (high-vis)(orange, yellow)
  description: A warm hoodie with high visibility markings for safety, this one is colored in orange and has yellow reflective strips.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Shirt/shirt_hoodie_high-vis_orange_yellow.rsi
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Shirt/shirt_hoodie_high-vis_orange_yellow.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
  - type: ToggleableClothing
    clothingPrototypes:
      faceshield: ClothingHoodHighVisOrangeYellow
      head: ClothingHeadHelmetBlock
  - type: HoodedClothing
    equippedPrefix: raised

#MARK: orange, yellow hood
- type: entity
  parent: ClothingfaceshieldBase
  id: ClothingHoodHighVisOrangeYellow
  name: hoodie hood (high-vis)
  categories: [ HideSpawnMenu ]
  description: The hood of a hoodie.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Head/Hoods/hood_hoodie_high-vis_orange_yellow.rsi
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Head/Hoods/hood_hoodie_high-vis_orange_yellow.rsi
    clothingVisuals:
      faceshield:
      - state: equipped-faceshield
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

