#MARK:  white
- type: entity
  parent: BaseClothingShirt
  id: ClothingShirtShortTShirtWhite
  name: shortsleeve t-shirt (white)
  description: A plain colored shortsleeve t-shirt.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Shirt/shirt_short_greyscale.rsi
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Shirt/shirt_short_greyscale.rsi

#MARK:  red
- type: entity
  parent: BaseClothingShirt
  id: ClothingShirtShortTShirtRed
  name: shortsleeve t-shirt (red)
  description: A plain colored shortsleeve t-shirt.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Shirt/shirt_short_greyscale.rsi
    color: "#9E1A1A"
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Shirt/shirt_short_greyscale.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#9E1A1A"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#9E1A1A"
      right:
