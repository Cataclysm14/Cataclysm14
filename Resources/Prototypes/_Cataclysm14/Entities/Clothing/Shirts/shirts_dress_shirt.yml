#MARK: Black
- type: entity
  parent: BaseClothingShirt
  id: ClothingShirtDressShirtBlack
  name: dress shirt (black)
  description: An tight fitted dress shirt for when you need to be on your 31'.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Shirt/shirt_dress_shirt_any.rsi
    layers:
    - state: icon
      color: "#141414"
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Shirt/shirt_dress_shirt_any.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#141414"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#141414"
      right:
      - state: inhand-right
        color: "#141414"

