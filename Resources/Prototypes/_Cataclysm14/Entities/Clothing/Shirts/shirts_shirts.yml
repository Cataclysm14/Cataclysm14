  id: ClothingShirtShirtWhite
  name: shirt (white)
  description: A plain colored shortsleeve shirt.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Shirt/shirt_shirt_any.rsi
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Shirt/shirt_shirt_any.rsi

