#MARK: Base
- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: BaseClothingShirt
  components:
  - type: Item
    storedOffset: 1,0
    shape:
    - 0,0,2,1
    size: Normal
    storedScale: 2.3

#MARK: Cargo
- type: entity
  abstract: true
  parent: [BaseClothingShirt, NFClothingBeltStorageBase, RecyclableItemClothBasic]
  id: BaseClothingShirtCargo
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,1

#MARK: Pocket
- type: entity
  abstract: true
  parent: [BaseClothingShirt, NFClothingBeltStorageBase, RecyclableItemClothBasic]
  id: BaseClothingShirtPocket
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,1

#MARK: Toggleable Head Block
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetBlock
  name: Blocked
  description: Can't fit anything there
  components:
  - type: Sprite
    sprite: Markers/cross.rsi

#MARK: Toggleable
- type: entity
  abstract: true
  parent: BaseClothingShirt
  id: BaseClothingShirtToggleable
  components:
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container {}
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
  - type: ToggleableClothing
    requiredSlot: INNERCLOTHING
    clothingPrototypes:
      head: ClothingHeadHelmetBlock
  - type: HoodedClothing
    equippedPrefix: raised
