#MARK: Black
- type: entity
  parent: BaseClothingPants
  id: ClothingPantsDressPantsBlack
  name: dress pants (black)
  description: An tight fitted dress pants for when you need to be on your 31'.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Pants/pants_dress_pants_any.rsi
    layers:
    - state: icon
      color: "#141414"
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Pants/pants_dress_pants_any.rsi
    clothingVisuals:
      pants:
      - state: equipped-PANTS
        color: "#141414"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#141414"
      right:
      - state: inhand-right
        color: "#141414"

