#MARK: Pants
- type: entity
  parent: BaseClothingPants
  id: ClothingPantsCombatMulticamAridPants
  name: combat pants (multicam arid)
  description: >
    Ripstop combat pants with large pockets.
    Originally created by the American company Crye Precision the multicam arid patern was adopted by a pletora of army throughout the world.
    This one dones darker and more contrasted colors with more tan for arid environments.
  components:
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Pants/PantsCombat/MulticamArid/pants_multicam_arid_pants.rsi
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Pants/PantsCombat/MulticamArid/pants_multicam_arid_pants.rsi

