
#ski mask no hole + ghost

#MARK: Ski Mask >






#MARK: Black
- type: entity
  parent: BaseClothingBalaclava
  id: ClothingBalaclavaBalaclavaSkiMaskBlack
  name: ski mask (black)
  description: A colored balaclava to make you look menacing.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Balaclavas/balaclava_ski_mask.rsi
    color: "#1F1F1F"
  - type: Clothing
    sprite: _Mono/Clothing/Balaclavas/balaclava_ski_mask.rsi
    clothingVisuals:
      balaclava:
      - state: equipped-BALACLAVA
        color: "#1F1F1F"
  - type: Item
    inhandVisuals:
      left:
