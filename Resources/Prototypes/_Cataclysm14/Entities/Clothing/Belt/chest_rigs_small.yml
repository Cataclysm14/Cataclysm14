    - type: Sprite
      sprite: _Cataclysm14/Clothing/Belt/chest_rig_security.rsi
    - type: Clothing
      sprite: _Cataclysm14/Clothing/Belt/chest_rig_security.rsi
    - type: ExplosionResistance
