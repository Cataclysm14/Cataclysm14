#MARK: Scav
  - type: entity
    parent: [NFClothingBeltStorageBase, ContentsExplosionResistanceBase]
    id: ClothingBeltChestRigScavenger
    name: scavenger vest
    description: A basic vests made for hunters, now used by scavengers.
    components:
    - type: StaticPrice
      price: 3000
      vendPrice: 5500
    - type: Sprite
      sprite: _Cataclysm14/Clothing/Belt/chest_rig_scav.rsi
    - type: Clothing
      sprite: _Cataclysm14/Clothing/Belt/chest_rig_scav.rsi
    - type: ExplosionResistance
      damageCoefficient: 0.9
    - type: Storage
      grid:
      # 2x3 * 2 + 2x1 * 2
      - 0,0,1,2
      - 0,4,1,4
      - 3,0,4,2
      - 3,4,4,4

#MARK: Security
  - type: entity
