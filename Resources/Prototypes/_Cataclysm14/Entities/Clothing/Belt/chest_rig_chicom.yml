#MARK: Chicom Ranger Green
- type: entity
  parent: [NFClothingBeltStorageBase, ContentsExplosionResistanceBase]
  id: ClothingBeltChestRigChicomRangerGreen
  name: chicom chest rig (ranger green)
  description: A basic vests made for infantry.
  components:
  - type: StaticPrice
    price: 4000
    vendPrice: 7000
  - type: Sprite
    sprite: _Cataclysm14/Clothing/Belt/chest_rig_chicom.rsi
    color: "#363D35"
  - type: Clothing
    sprite: _Cataclysm14/Clothing/Belt/chest_rig_chicom.rsi
    clothingVisuals:
      belt:
      - state: equipped-BELT
        color: "#363D35"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#363D35"
      right:
      - state: inhand-right
        color: "#363D35"
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Storage
    grid:
    # 2x3 * 3
    - 0,0,1,2
    - 3,0,4,2
    - 6,0,7,2

