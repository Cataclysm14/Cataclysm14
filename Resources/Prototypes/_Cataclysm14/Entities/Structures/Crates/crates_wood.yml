#MARK: Shipping Wood
- type: entity
  parent: StructureCrateBase
  id: StructureCrateShippingWood
  name: wooden shipping crate
  components:
  - type: Sprite
    scale: 1,0.6
    offset: 0,0.10
    sprite: _Cataclysm14/Structures/Crates/crate_shipping_wood.rsi
  - type: Icon
    sprite: _Cataclysm14/Structures/Crates/crate_shipping_wood.rsi
    state: base
  - type: Climbable
    delay: 2.0
  - type: EntityStorage
    capacity: 50
    isCollidableWhenOpen: true
    itemCanStoreMobs: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.35,0.4"
        density: 50
        mask:
        - CrateMask
        layer:
        - MachineLayer
