#MARK: Slug
- type: entity
  id: Pellet12GaugeSlug
  categories: [ HideSpawnMenu ]
  parent: BaseProjectileShotgunBulletSlug
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 75
        Structural: 50
    armorPenetration: -0.2

#MARK: Beanbag
- type: entity
  id: Pellet12GaugeBeanbag
  categories: [ HideSpawnMenu ]
  parent: BaseProjectileShotgunBulletBeanbag
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 5
    armorPenetration: -0.2
  - type: StaminaDamageOnCollide
    damage: 60 # 2 hits to stun

#MARK: Buckshot
- type: entity
  id: Pellet12GaugeBuckshot
  categories: [ HideSpawnMenu ]
  parent: BaseProjectileShotgunBulletPellet
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20
        Structural: 20
    armorPenetration: -0.5

  - type: ProjectileDamageFalloff
    falloffStart: 2
    falloffPerTile: 0.25
    minimumMultiplier: 0.50
    stepByTile: false

- type: entity
  id: Pellet12GaugeBuckshotSpread
  categories: [ HideSpawnMenu ]
  parent: Pellet12GaugeBuckshot
  components:
  - type: ProjectileSpread
    proto: Pellet12GaugeBuckshot
    count: 6
    spread: 15

