#MARK: Random medicine
- type: entityTable
  id: LootTableMedicineRandom
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: LootTableMedicineBasic
    - !type:NestedSelector
      tableId: LootTableMedicineOils
    - !type:NestedSelector
      tableId: LootTableMedicineInjectors
    - !type:NestedSelector
      tableId: LootTableMedicineKits

#MARK: Basic medicine
- type: entityTable
  id: LootTableMedicineBasic
