#MARK: BasicMedicine Shelves
- type: entity
  id: StructureFurnitureShelfMetalFilledMedBasic
  suffix: MedBasic 100%
  parent: StructureFurnitureShelfMetal
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: LootTableMedicineBasic
        rolls: !type:RangeNumberSelector
            range: 1,6

- type: entity
  id: StructureFurnitureShelfMetalFilledMedBasicRandom75
  suffix: MedBasic 75%
  parent: StructureFurnitureShelfMetal
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: LootTableMedicineBasic
        rolls: !type:RangeNumberSelector
            range: 1,6
        prob: 0.75

- type: entity
  id: StructureFurnitureShelfMetalFilledMedBasicRandom50
  suffix: MedBasic 50%
  parent: StructureFurnitureShelfMetal
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: LootTableMedicineBasic
        rolls: !type:RangeNumberSelector
            range: 1,6
        prob: 0.5

