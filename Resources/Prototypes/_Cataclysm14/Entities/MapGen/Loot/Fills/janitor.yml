#MARK: Janitor 100%
- type: entity
  id: StructureFurnitureLockerMetalThirdTripleFilledJanitor
  suffix: Janitor 100%
  parent: StructureFurnitureLockerMetalThirdTriple
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        children:
        - !type:AllSelector
          children:
          - !type:NestedSelector
            tableId: LootTableJanitorItems
          rolls: !type:RangeNumberSelector
            range: 2,7

#MARK: Janitor 50%
- type: entity
  id: StructureFurnitureLockerMetalThirdTripleFilledJanitorRandom50
  suffix: Janitor 50%
  parent: StructureFurnitureLockerMetalThirdTriple
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        children:
        - !type:AllSelector
          children:
          - !type:NestedSelector
            tableId: LootTableJanitorItems
          rolls: !type:RangeNumberSelector
            range: 2,7
        prob: 0.50