#MARK: Normal >





#MARK: Survivor
- type: entity
  parent: BaseMobZombieSimple
  id: MobZombieSurvivor
  suffix: Survivor
  components:
  - type: Inventory
    templateId: InvTemplateZombieBase
  - type: EntityTableOutfitContainerFill
    containers:
      outerClothing: !type:NestedSelector
        tableId: LootTableClothingBulletProofVestCivilian
        prob: 0.90
      # head: !type:NestedSelector
      #   tableId: LootTableClothingHatHardHat
      #   prob: 0.95
      belt: !type:GroupSelector
        children:
        - id: ClothingBeltDutyBeltPoliceFilledPolice
          weight: 2
        - id: ClothingBeltDutyBeltPolice
        prob: 0.9
      gloves: !type:NestedSelector
        tableId: LootTableClothingCombatGloves
        prob: 0.70
      # balaclava: !type:GroupSelector
      #   children:
      #   - id: ClothingBalaclavaBalaclavaSkiMaskBlack
      #   prob: 0.8
      shoes: !type:GroupSelector
        children:
        - id: ClothingShoesBootsSWATBootsBlack
        prob: 0.99
      pants: !type:GroupSelector
        children:
        - !type:NestedSelector
          tableId: LootTableClothingBottomCivilian
        - !type:NestedSelector
          tableId: LootTableClothingPantsDuty
          weight: 2
        - !type:NestedSelector
          tableId: LootTableClothingPantsDutyMercenary
        prob: 0.99
      jumpsuit: !type:NestedSelector
        tableId: LootTableClothingTopCivilian
        prob: 0.99
      id: !type:GroupSelector
        children:
        - id: AccessIdentificationIDCardUS
        prob: 0.15

