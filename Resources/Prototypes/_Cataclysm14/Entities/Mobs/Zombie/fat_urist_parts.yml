# Cata 14 add; Body parts for the Fat Urist zombie

- type: entity
  id: PartZombieFatUrist
  categories: [ HideSpawnMenu ]
  parent: PartZombie
  name: fat urist zombie body part
  abstract: true
  components:
  - type: Icon
    sprite: _Cataclysm14/Mobs/Species/Zombies/ZombieFat/parts.rsi
  - type: BodyPart
    species: SpecieZombieFatUrist

- type: entity
  id: TorsoZombieFatUrist
  categories: [ HideSpawnMenu ]
  name: fat urist zombie torso
  parent: [PartZombieFatUrist, BaseZombieTorso]
  components:
  - type: Sprite
    sprite: _Cataclysm14/Mobs/Species/Zombies/ZombieFat/parts.rsi
    state: torso
  - type: Icon
    sprite: _Cataclysm14/Mobs/Species/Zombies/ZombieFat/parts.rsi
    state: torso
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 20
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadZombieFatUrist
  categories: [ HideSpawnMenu ]
