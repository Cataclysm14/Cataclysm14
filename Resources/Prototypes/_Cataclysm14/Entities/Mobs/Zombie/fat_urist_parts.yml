- type: body
  id: BodyPartSetZombieFatUrist
  categories: [ HideSpawnMenu ]
  name: fat urist zombie
  root: torso
  slots:
    head:
      part: HeadZombieFatUrist
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
    torso:
      part: TorsoZombieFatUrist
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganHumanHeart
        lungs: OrganHumanLungs
        stomach: OrganHumanStomach
        liver: OrganHumanLiver
        kidneys: OrganHumanKidneys
    right arm:
      part: RightArmZombieFatUrist
      connections:
      - right hand
    left arm:
      part: LeftArmZombieFatUrist
      connections:
      - left hand
    right hand:
      part: RightHandZombieFatUrist
    left hand:
      part: LeftHandZombieFatUrist
    right leg:
      part: RightLegZombieFatUrist
      connections:
      - right foot
    left leg:
      part: LeftLegZombieFatUrist
      connections:
      - left foot
    right foot:
      part: RightFootZombieFatUrist
    left foot:
      part: LeftFootZombieFatUrist
