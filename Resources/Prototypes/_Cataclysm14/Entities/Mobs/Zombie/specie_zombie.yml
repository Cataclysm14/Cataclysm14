  prototype: MobZombieNaked #Not really important
  sprites: MobZombieSpritesBase
  defaultSkinTone: "#4F7942"
  markingLimits: MobZombieMarkingLimits
  dollPrototype: MobZombieDummy  #Not really important either
  skinColoration: HumanToned

