# Cata 14 add; Zona 14 Fat Urist body sprites
# Head and Chest require Male/Female humanoidBaseSprite variants because
# Cataclysm's HumanoidAppearanceSystem sex-morphs those prototype IDs
# But honestly, who the fuck cares? I sure don't!

- type: species
  id: SpecieZombieFatUrist
  name: species-name-zombie-fat
  roundStart: false
  prototype: MobZombieFatNaked
  sprites: MobZombieFatUristSprites
  defaultSkinTone: "#4F7942"
  markingLimits: MobZombieMarkingLimits
  dollPrototype: MobZombieDummy
  skinColoration: HumanToned

- type: speciesBaseSprites
  id: MobZombieFatUristSprites
  sprites:
    Head: MobZombieFatUristHead
    Chest: MobZombieFatUristTorso
    Eyes: MobHumanoidEyes
    LArm: MobZombieFatUristLArm
    RArm: MobZombieFatUristRArm
    LHand: MobZombieFatUristLHand
    RHand: MobZombieFatUristRHand
    LLeg: MobZombieFatUristLLeg
    RLeg: MobZombieFatUristRLeg
    LFoot: MobZombieFatUristLFoot
    RFoot: MobZombieFatUristRFoot

- type: humanoidBaseSprite
  id: MobZombieFatUristHead
  categories: [ HideSpawnMenu ]
  baseSprite:
    sprite: _Cataclysm14/Mobs/Species/Zombie/FatUrist/parts.rsi
